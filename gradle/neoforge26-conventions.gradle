group = project.mod_group
version = project.version

repositories {
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://api.modrinth.com/maven" }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file("run")
        }
    }

    mods {
        accuratefpsplus {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java {
            srcDir("../mc26/src/client/java")
            srcDir("../mcCompat/${project.minecraft_compat}/java")
            srcDir("../shared/src/client/java")
            srcDir("../neoforge26-common/src/main/java")
            srcDir("../neoforge26-common/src/client/java")
            exclude("com/accuratefpsplus/AccurateFpsPlusFabricClient.java")
            exclude("com/accuratefpsplus/mixin/client/OptionsAccessor.java")
            exclude("com/accuratefpsplus/modmenu/**")
            if (project.minecraft_compat == "26.1") {
                exclude("**/HudExtractRenderStateMixin.java")
            }
        }
        resources {
            setSrcDirs(["../neoforge26/src/main/resources", "../src/main/resources"])
            exclude("fabric.mod.json")
            exclude("accuratefpsplus.accesswidener")
            exclude("accuratefpsplus.client.mixins.json")
        }
    }
    test {
        java.srcDir("../shared/src/test/java")
    }
}

dependencies {
    compileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    compileOnly "maven.modrinth:yacl:${project.yacl_version}"
    compileOnly "maven.modrinth:sodium:${project.sodium_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    if (project.hasProperty("smokeSodium")) {
        runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"
    }
    if (project.hasProperty("smokeCloth")) {
        runtimeOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
    }
    if (project.hasProperty("smokeYacl")) {
        runtimeOnly "maven.modrinth:yacl:${project.yacl_version}"
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs.add("-Xlint:deprecation")
}

processResources {
    def metadata = [
        mod_version: project.version,
        minecraft_version: project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        minecraft_compat: project.minecraft_compat,
        neoforge_version: project.neoforge_version,
        neoforge_version_range: project.hasProperty("neoforge_version_range")
            ? project.neoforge_version_range
            : "[${project.neoforge_version},)",
        client_mixin_config: project.client_mixin_config,
        cloth_config_min_version: project.cloth_config_min_version,
        yacl_min_version: project.yacl_min_version
    ]
    inputs.properties(metadata)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(metadata)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

base {
    archivesName = "accuratefpsplus-${project.minecraft_version}"
}

tasks.named("jar") {
    archiveClassifier = "neoforge"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("../LICENSE") {
        rename { "${it}_accuratefpsplus" }
    }
}

tasks.named("sourcesJar") {
    archiveClassifier = "neoforge-sources"
}
