# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew ./mc1211/gradlew
      - name: build
        run: ./gradlew buildAllVersions
      - name: verify release jars
        run: ./gradlew verifyReleaseJars
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            build/libs/accuratefpsplus-1.21.1-*-fabric.jar
            build/libs/accuratefpsplus-1.21.1-*-neoforge.jar
            build/libs/accuratefpsplus-1.21.11-*-fabric.jar
            build/libs/accuratefpsplus-1.21.11-*-neoforge.jar
