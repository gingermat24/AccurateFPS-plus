plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'eclipse'
	id 'idea'
}

repositories {
	mavenCentral()
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.terraformersmc.com/releases" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.isxander.dev/releases" }
	maven { url = "https://maven.quiltmc.org/repository/release/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"accuratefpsplus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	modCompileOnly "maven.modrinth:yacl:${project.yacl_version}"
	if (project.hasProperty("smokeCloth")) {
		modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	}
	if (project.hasProperty("smokeSodium")) {
		modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
	if (project.hasProperty("smokeYacl")) {
		modLocalRuntime "maven.modrinth:yacl:${project.yacl_version}"
		// Loom's dev run does not expose YACL's nested parser jars from the Modrinth Maven artifact.
		runtimeOnly "org.quiltmc.parsers:gson:0.2.1"
	}
}

sourceSets.client.java.srcDir("../shared/src/client/java")
sourceSets.test.java.srcDirs("../shared/src/client/java", "../shared/src/test/java")

dependencies {
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

base {
	archivesName = "accuratefpsplus-${project.minecraft_version}"
}

tasks.named('remapJar') {
	archiveClassifier = 'fabric'
}

tasks.named('remapSourcesJar') {
	archiveClassifier = 'fabric-sources'
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
