modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="accuratefpsplus"
version="${mod_version}"
displayName="AccurateFPS+"
authors="gingermat"
description='''Lightweight, configurable performance HUD with precise FPS, AVG, MAX, and MIN telemetry.'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.accuratefpsplus]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.accuratefpsplus]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.accuratefpsplus]]
modId="cloth_config"
type="optional"
versionRange="[${cloth_config_min_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.accuratefpsplus]]
modId="yet_another_config_lib_v3"
type="optional"
versionRange="[${yacl_min_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.accuratefpsplus]]
modId="sodium"
type="optional"
versionRange="[${sodium_min_version},)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="accuratefpsplus.client.mixins.json"

[[mixins]]
config="accuratefpsplus.sodium.mixins.json"
