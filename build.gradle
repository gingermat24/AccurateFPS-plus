plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.terraformersmc.com/releases" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.isxander.dev/releases" }
	maven { url = "https://maven.quiltmc.org/repository/release/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"accuratefpsplus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}


dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	modCompileOnly "maven.modrinth:yacl:${project.yacl_version}"
	if (project.hasProperty("smokeCloth")) {
		modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	}
	if (project.hasProperty("smokeSodium")) {
		modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
	if (project.hasProperty("smokeYacl")) {
		modLocalRuntime "maven.modrinth:yacl:${project.yacl_version}"
		// Loom's dev run does not expose YACL's nested parser jars from the Modrinth Maven artifact.
		runtimeOnly "org.quiltmc.parsers:gson:0.2.1"
	}
}

sourceSets.client.java.srcDir("shared/src/client/java")
sourceSets.test.java.srcDirs("shared/src/client/java", "shared/src/test/java")

dependencies {
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

base {
	archivesName = "accuratefpsplus-${project.minecraft_version}"
}

tasks.named('remapJar') {
	archiveClassifier = 'fabric'
}

tasks.named('remapSourcesJar') {
	archiveClassifier = 'fabric-sources'
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def build1211 = tasks.register("build1211", Exec) {
	group = "build"
	description = "Builds the Minecraft 1.21.1 version of AccurateFPS+"
	workingDir = file("mc1211")
	if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
		commandLine 'cmd', '/c', '.\\gradlew.bat', 'clean', 'build'
	} else {
		commandLine './gradlew', 'clean', 'build'
	}
}

def copy1211Jar = tasks.register("copy1211Jar", Copy) {
	group = "build"
	description = "Copies the Minecraft 1.21.1 release jar into build/libs"
	dependsOn build1211

	def artifact = file("mc1211/build/libs/accuratefpsplus-1.21.1-${project.version}-fabric.jar")
	from(artifact)
	into(layout.buildDirectory.dir("libs"))

	doFirst {
		if (!artifact.isFile()) {
			throw new GradleException("Minecraft 1.21.1 jar was not produced: ${artifact}")
		}
	}
}

tasks.named("build") {
	dependsOn copy1211Jar
}

tasks.register("buildAllVersions") {
	group = "build"
	description = "Builds both supported Minecraft versions into build/libs"
	dependsOn "build"
}
