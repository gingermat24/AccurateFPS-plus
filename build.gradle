plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.terraformersmc.com/releases" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.isxander.dev/releases" }
	maven { url = "https://maven.quiltmc.org/repository/release/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"accuratefpsplus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}


dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	modCompileOnly "maven.modrinth:yacl:${project.yacl_version}"
	if (project.hasProperty("smokeCloth")) {
		modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	}
	if (project.hasProperty("smokeSodium")) {
		modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
	if (project.hasProperty("smokeYacl")) {
		modLocalRuntime "maven.modrinth:yacl:${project.yacl_version}"
		// Loom's dev run does not expose YACL's nested parser jars from the Modrinth Maven artifact.
		runtimeOnly "org.quiltmc.parsers:gson:0.2.1"
	}
}

sourceSets.client.java.srcDir("shared/src/client/java")
sourceSets.client.java.srcDir("fabric-platform/src/client/java")
sourceSets.test.java.srcDirs("shared/src/client/java", "shared/src/test/java")

dependencies {
	testImplementation platform("org.junit:junit-bom:6.1.3")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

base {
	archivesName = "accuratefpsplus-${project.minecraft_version}"
}

tasks.named('remapJar') {
	archiveClassifier = 'fabric'
}

tasks.named('remapSourcesJar') {
	archiveClassifier = 'fabric-sources'
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def build1211 = tasks.register("build1211", Exec) {
	group = "build"
	description = "Builds the Minecraft 1.21.1 version of AccurateFPS+"
	workingDir = file("mc1211")
	if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
		commandLine 'cmd', '/c', '.\\gradlew.bat', 'clean', 'build'
	} else {
		commandLine './gradlew', 'clean', 'build'
	}
}

def copy1211Jar = tasks.register("copy1211Jar", Copy) {
	group = "build"
	description = "Copies the Minecraft 1.21.1 release jar into build/libs"
	dependsOn build1211

	def artifact = file("mc1211/build/libs/accuratefpsplus-1.21.1-${project.version}-fabric.jar")
	from(artifact)
	into(layout.buildDirectory.dir("libs"))

	doFirst {
		if (!artifact.isFile()) {
			throw new GradleException("Minecraft 1.21.1 jar was not produced: ${artifact}")
		}
	}
}

def buildNeoForge1211 = tasks.register("buildNeoForge1211", Exec) {
	group = "build"
	description = "Builds the NeoForge version for Minecraft 1.21.1"
	workingDir = rootDir
	if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
		commandLine 'cmd', '/c', '.\\gradlew.bat', '-p', 'neoforge1211', 'clean', 'build'
	} else {
		commandLine './gradlew', '-p', 'neoforge1211', 'clean', 'build'
	}
}

def copyNeoForge1211Jar = tasks.register("copyNeoForge1211Jar", Copy) {
	group = "build"
	description = "Copies the NeoForge 1.21.1 release jar into build/libs"
	dependsOn buildNeoForge1211

	def artifact = file("neoforge1211/build/libs/accuratefpsplus-1.21.1-${project.version}-neoforge.jar")
	from(artifact)
	into(layout.buildDirectory.dir("libs"))

	doFirst {
		if (!artifact.isFile()) {
			throw new GradleException("NeoForge 1.21.1 jar was not produced: ${artifact}")
		}
	}
}

def buildNeoForge12111 = tasks.register("buildNeoForge12111", Exec) {
	group = "build"
	description = "Builds the NeoForge version for Minecraft 1.21.11"
	workingDir = rootDir
	if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
		commandLine 'cmd', '/c', '.\\gradlew.bat', '-p', 'neoforge12111', 'clean', 'build'
	} else {
		commandLine './gradlew', '-p', 'neoforge12111', 'clean', 'build'
	}
}

def copyNeoForge12111Jar = tasks.register("copyNeoForge12111Jar", Copy) {
	group = "build"
	description = "Copies the NeoForge 1.21.11 release jar into build/libs"
	dependsOn buildNeoForge12111

	def artifact = file("neoforge12111/build/libs/accuratefpsplus-1.21.11-${project.version}-neoforge.jar")
	from(artifact)
	into(layout.buildDirectory.dir("libs"))

	doFirst {
		if (!artifact.isFile()) {
			throw new GradleException("NeoForge 1.21.11 jar was not produced: ${artifact}")
		}
	}
}

tasks.named("build") {
	dependsOn copy1211Jar
	dependsOn copyNeoForge1211Jar
	dependsOn copyNeoForge12111Jar
}

tasks.register("buildAllVersions") {
group = "build"
description = "Builds Fabric and NeoForge artifacts for Minecraft 1.21.1 and 1.21.11 into build/libs"
dependsOn "build"
dependsOn "verifyReleaseJars"
}

def releaseVersion = project.version

tasks.register("verifyReleaseJars") {
	group = "verification"
	description = "Verifies all four release jars have matching feature classes and loader-specific metadata"
	dependsOn "build"

	doLast {
		def expectedArtifacts = [
			"accuratefpsplus-1.21.1-${releaseVersion}-fabric.jar"   : ["fabric", "1.21.1"],
			"accuratefpsplus-1.21.1-${releaseVersion}-neoforge.jar": ["neoforge", "1.21.1"],
			"accuratefpsplus-1.21.11-${releaseVersion}-fabric.jar" : ["fabric", "1.21.11"],
			"accuratefpsplus-1.21.11-${releaseVersion}-neoforge.jar": ["neoforge", "1.21.11"]
		]
		def sharedEntries = [
			"com/accuratefpsplus/AccurateFpsPlusClient.class",
			"com/accuratefpsplus/ConfigManager.class",
			"com/accuratefpsplus/ConfigScreen.class",
			"com/accuratefpsplus/YaclConfigScreen.class",
			"com/accuratefpsplus/FpsTelemetryEngine.class",
			"com/accuratefpsplus/ThresholdMode.class",
			"com/accuratefpsplus/api/AccurateFpsApi.class",
			"accuratefpsplus.client.mixins.json",
			"accuratefpsplus.sodium.mixins.json",
			"assets/accuratefpsplus/lang/en_us.json"
		]

		expectedArtifacts.each { filename, expected ->
			def artifact = layout.buildDirectory.file("libs/${filename}").get().asFile
			if (!artifact.isFile()) {
				throw new GradleException("Release artifact is missing: ${artifact}")
			}

			def archive = new java.util.zip.ZipFile(artifact)
			try {
				def entries = archive.entries().collect { it.name } as Set
				def missingEntries = sharedEntries.findAll { !entries.contains(it) }
				if (!missingEntries.isEmpty()) {
					throw new GradleException("${filename} is missing shared feature entries: ${missingEntries.join(', ')}")
				}

				def hasFabricMetadata = entries.contains("fabric.mod.json")
				def hasNeoForgeMetadata = entries.contains("META-INF/neoforge.mods.toml")
				if (expected[0] == "fabric") {
					if (!hasFabricMetadata || hasNeoForgeMetadata || !entries.contains("accuratefpsplus.accesswidener")) {
						throw new GradleException("${filename} does not contain only the expected Fabric metadata")
					}
					def metadata
					archive.getInputStream(archive.getEntry("fabric.mod.json")).withCloseable { stream ->
						metadata = new groovy.json.JsonSlurper().parse(stream)
					}
					if (metadata.version != releaseVersion || metadata.depends.minecraft != expected[1]) {
						throw new GradleException("${filename} metadata does not match version ${releaseVersion} and Minecraft ${expected[1]}")
					}
					if (!entries.contains("com/accuratefpsplus/AccurateFpsPlusFabricClient.class")) {
						throw new GradleException("${filename} is missing the Fabric client entrypoint")
					}
				} else {
					if (!hasNeoForgeMetadata || hasFabricMetadata || entries.contains("accuratefpsplus.accesswidener")) {
						throw new GradleException("${filename} does not contain only the expected NeoForge metadata")
					}
					def metadata
					archive.getInputStream(archive.getEntry("META-INF/neoforge.mods.toml")).withCloseable { stream ->
						metadata = stream.getText("UTF-8")
					}
					if (!metadata.contains("version=\"${releaseVersion}\"") || !metadata.contains("versionRange=\"[${expected[1]}]\"")) {
						throw new GradleException("${filename} metadata does not match version ${releaseVersion} and Minecraft ${expected[1]}")
					}
					if (!entries.contains("com/accuratefpsplus/neoforge/AccurateFpsPlusNeoForge.class")) {
						throw new GradleException("${filename} is missing the NeoForge mod entrypoint")
					}
				}
			} finally {
				archive.close()
			}
		}
	}
}
